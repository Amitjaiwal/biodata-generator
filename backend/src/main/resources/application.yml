# ShubhPatra backend configuration.
# Every secret comes from an environment variable. Nothing sensitive is committed.

spring:
  application:
    name: shubhpatra-backend
  config:
    # Local secrets: an optional backend/.env file (KEY=value lines, never committed).
    import: optional:file:.env[.properties]
  profiles:
    # Local runs use the "dev" profile (in-memory H2, demo payments). Production sets SPRING_PROFILES_ACTIVE=prod.
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Comma-separated list of site origins allowed to call the API from a browser.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  pricing:
    currency: INR
    # Amounts are in paise. Change them here or with environment variables; no frontend build is needed.
    premium-single-amount: ${APP_PRICE_PREMIUM_SINGLE:4900}
    premium-collection-amount: ${APP_PRICE_PREMIUM_COLLECTION:9900}
    validity-days: ${APP_VALIDITY_DAYS:365}
    # Template ids that may be bought individually. Keep in step with the frontend registry.
    premium-templates: maharaja,paithani,rajwada,mehfil,kamal,monogram,metro,tulsi,vivah,ivory,mayur,samyak,zarika,rani,neelmahal,nishan,blush
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  entitlement:
    # HMAC key for purchase tokens, at least 32 characters.
    secret: ${APP_ENTITLEMENT_SECRET:}
  payments:
    # Demo mode simulates payments without Razorpay. It must never be enabled in production.
    demo-mode: false
  rate-limit:
    requests-per-minute: 40

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:shubhpatra;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

app:
  entitlement:
    secret: ${APP_ENTITLEMENT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  payments:
    # Uses real Razorpay test keys when they are provided, otherwise simulated payments.
    demo-mode: ${APP_DEMO_MODE:true}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5

app:
  payments:
    demo-mode: false
