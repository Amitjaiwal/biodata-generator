# Netlify settings. In the Netlify dashboard set the base directory to "frontend".
# Every page is a prerendered file and unknown addresses get 404.html, so no page rewrites
# are needed. When the backend is deployed, uncomment the /api rule and set its address.
[build]
  command = "npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "11"

# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-HOST/api/:splat"
#   status = 200
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
